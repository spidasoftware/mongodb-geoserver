# Java Gradle CircleCI configuration file
# See: https://circleci.com/docs/language-java/
version: 2.1

jobs:
  build:
    docker:
      # Gradle 9 and GeoTools 34 require JDK 17+
      - image: cimg/openjdk:17.0
      # MongoDB for the Spock tests (reachable on localhost:27017)
      - image: mongo:7.0

    working_directory: ~/repo

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v2-dependencies-

      - run: ./gradlew dependencies

      - save_cache:
          paths:
            - ~/.gradle
          key: v2-dependencies-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

      - run: ./gradlew test distZip

      - store_test_results:
          path: build/test-results

      - store_artifacts:
          path: build/distributions

workflows:
  main-workflow:
    jobs:
      - build
